<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Mapa esquemático de Puno</title>
  <desc id="d">Lago Titicaca con las islas Uros y Taquile, la ciudad de Puno, Sillustani y Ayaviri.</desc>
  <style>
    .tierra{fill:#e7dcc3}
    .lago{fill:#2a7f9a}
    .cerro{fill:#cdbd98}
    .pto{fill:#b0306a;stroke:#fff;stroke-width:3}
    .pulso{fill:#b0306a;opacity:.5;transform-box:fill-box;transform-origin:center;animation:pulso 2.4s ease-out infinite}
    .etq{font:700 17px Georgia,serif;fill:#0d3b4a;paint-order:stroke;stroke:#f3ede0;stroke-width:5px}
    .etq-lago{font:italic 700 26px Georgia,serif;fill:#e9f6fa}
    @keyframes pulso{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulso{animation:none}}
  </style>
  <rect class="tierra" width="800" height="500" rx="14"/>
  <path class="cerro" d="M0 420 L70 340 L130 400 L200 320 L270 410 L330 360 L400 450 L460 500 L0 500Z"/>
  <path class="cerro" d="M520 0 L580 0 L640 40 L700 0 L800 40 L800 0Z"/>
  <path class="lago" d="M410 215 C450 160 540 150 610 175 C690 200 735 260 720 330 C705 400 640 440 560 430 C490 422 450 395 425 350 C400 305 385 255 410 215Z"/>
  <text class="etq-lago" x="520" y="385">Lago Titicaca</text>
  <circle class="pulso" cx="150" cy="95" r="14"/><circle class="pto" cx="150" cy="95" r="11"/>
  <text class="etq" x="172" y="101">Ayaviri</text>
  <circle class="pulso" cx="280" cy="235" r="14"/><circle class="pto" cx="280" cy="235" r="11"/>
  <text class="etq" x="205" y="270">Sillustani</text>
  <circle class="pulso" cx="400" cy="335" r="14"/><circle class="pto" cx="400" cy="335" r="11"/>
  <text class="etq" x="330" y="372">Puno</text>
  <circle class="pulso" cx="470" cy="300" r="14"/><circle class="pto" cx="470" cy="300" r="11"/>
  <text class="etq" x="440" y="282">Uros</text>
  <circle class="pulso" cx="590" cy="260" r="14"/><circle class="pto" cx="590" cy="260" r="11"/>
  <text class="etq" x="540" y="238">Taquile</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
